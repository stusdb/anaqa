<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oria Luxe - لوحة التحكم</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --bg: #050505;
      --surface: #0b0b0c;
      --surface-2: #111214;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(212,165,116,0.28);
      --text: #f6f1eb;
      --text-muted: #c7bfb5;
      --text-faint: #8c837b;
      --gold: #d4a574;
      --danger: #cc6f6f;
      --success: #36b36d;
      --shadow: 0 18px 60px rgba(0,0,0,0.38);
      --transition: 180ms cubic-bezier(.16,1,.3,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(180deg, #060606 0%, #030303 100%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    .container { width: min(calc(100% - 32px), 1180px); margin-inline: auto; }

    .site-header {
      position: sticky; top: 0; z-index: 1000; background: rgba(18,18,19,0.95);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 0;
    }
    .navbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { font-size: 1.8rem; font-weight: 800; color: #e6d8c9; }
    .nav-right { display: flex; align-items: center; gap: 16px; }

    .icon-btn {
      width: 42px; height: 42px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); color: var(--text); transition: var(--transition);
    }
    .icon-btn:hover { background: rgba(255,255,255,0.06); border-color: var(--border-strong); }

    /* Tabs Navigation */
    .tabs-nav { display: flex; gap: 12px; margin-top: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; font-weight: 700; padding: 10px 20px; transition: var(--transition); border-radius: 8px 8px 0 0; }
    .tab-btn.active { color: var(--gold); background: rgba(212,165,116,0.1); border-bottom: 3px solid var(--gold); }
    .tab-btn:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.05); }
    
    .tab-content { display: none; padding-top: 20px; }
    .tab-content.active { display: block; }

    .main { padding: 20px 0 40px; }
    .section-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 28px; }
    .section-title .accent { color: var(--gold); }

    .form-card {
      background: linear-gradient(180deg, #111214 0%, #0b0c0f 100%);
      border: 1px solid var(--border); border-radius: 26px; padding: 28px; box-shadow: var(--shadow); margin-bottom: 28px;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 20px; }
    .form-grid.full { grid-template-columns: 1fr; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: .9rem; color: var(--text-muted); font-weight: 600; }

    input, select, textarea {
      width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text); border-radius: 14px; padding: 12px 16px; outline: none; transition: var(--transition);
    }
    textarea { min-height: 100px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(212,165,116,0.12); background: rgba(255,255,255,0.05); }

    .btn {
      min-height: 52px; padding: 0 28px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      font-weight: 800; transition: var(--transition); border: 1px solid transparent;
    }
    .btn-primary { background: linear-gradient(180deg, #ddb07e 0%, #d4a574 100%); color: #111; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(212,165,116,0.28); }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.12); }
    .btn-danger { background: rgba(204,111,111,0.12); color: var(--danger); border: 1px solid rgba(204,111,111,0.24); }

    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 28px; }
    .product-item { background: linear-gradient(180deg, #111214 0%, #0b0c0f 100%); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
    .product-image { width: 100%; height: 200px; object-fit: cover; }
    .product-info { padding: 16px; }
    .product-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; }
    .product-price { color: var(--gold); font-weight: 800; font-size: 1.2rem; margin-bottom: 12px; }
    .product-actions { display: flex; gap: 8px; }
    .product-actions button { flex: 1; padding: 10px; border-radius: 10px; font-weight: 700; border: 1px solid rgba(255,255,255,0.08); }
    .edit-btn { background: rgba(212,165,116,0.08); color: var(--gold); }
    .delete-btn { background: rgba(204,111,111,0.08); color: var(--danger); }

    /* Orders CSS */
    .orders-grid { display: flex; flex-direction: column; gap: 16px; }
    .order-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: grid; gap: 16px; position: relative; }
    .order-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .order-info h3 { margin-bottom: 4px; color: var(--gold); }
    .order-info p { color: var(--text-muted); font-size: 0.9rem; }
    .order-status { font-weight: 700; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; }
    .status-pending { background: rgba(212, 165, 116, 0.15); color: #d4a574; }
    .status-shipped { background: rgba(54, 145, 179, 0.15); color: #3691b3; }
    .status-completed { background: rgba(54, 179, 109, 0.15); color: #36b36d; }
    .status-cancelled { background: rgba(204, 111, 111, 0.15); color: #cc6f6f; }
    
    .order-details { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .order-items-list { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; }
    .order-item-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; border-bottom: 1px dashed rgba(255,255,255,0.05); padding-bottom: 8px;}
    .order-item-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0;}
    .order-item-row img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; margin-left: 10px; }
    
    .order-totals { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; }
    .order-actions { display: flex; gap: 10px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 16px;}
    .status-btn { padding: 8px 16px; border-radius: 8px; font-weight: bold; transition: var(--transition); border: 1px solid var(--border); }
    .status-btn:hover { transform: translateY(-2px); }

    .message-box { padding: 14px 18px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-weight: 600; }
    .message-box.success { background: rgba(54,179,109,0.12); color: var(--success); border: 1px solid rgba(54,179,109,0.24); }
    .message-box.error { background: rgba(204,111,111,0.12); color: var(--danger); border: 1px solid rgba(204,111,111,0.24); }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; padding: 24px; }
    .modal.open { display: flex; }
    .modal-content { background: linear-gradient(180deg, #121316 0%, #0b0c0d 100%); border: 1px solid var(--border); border-radius: 22px; padding: 28px; max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .modal-title { font-size: 1.6rem; font-weight: 800; }
    .close-modal { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: var(--text); cursor: pointer; transition: var(--transition); }
    .close-modal:hover { background: rgba(255,255,255,0.08); }

    @media (max-width: 760px) {
      .form-grid, .order-details { grid-template-columns: 1fr; }
      .products-grid { grid-template-columns: 1fr; }
      .order-actions { flex-wrap: wrap; }
      .order-actions .status-btn { flex: 1; min-width: 45%; text-align: center; }
      .image-color-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="#" class="brand">Oria Luxe <span style="font-size:.7em;color:var(--gold)">Admin</span></a>
      <div class="nav-right">
        <button class="icon-btn" id="refreshBtn" aria-label="تحديث"><i class="fa-solid fa-arrow-rotate-right"></i></button>
        <button class="icon-btn" onclick="window.location.href='index.html'" aria-label="المتجر"><i class="fa-solid fa-store"></i></button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <div id="messageBox"></div>

      <!-- أزرار التنقل -->
      <div class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('orders')"><i class="fa-solid fa-box"></i> الطلبات الجديدة</button>
        <button class="tab-btn" onclick="switchTab('products')"><i class="fa-solid fa-tags"></i> إدارة المنتجات</button>
      </div>

      <!-- 1. قسم الطلبات -->
      <div id="ordersTab" class="tab-content active">
        <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:20px"><i class="fa-solid fa-list-check"></i> طلبات الزبائن</h2>
        <div class="orders-grid" id="ordersGrid">
          <div style="text-align:center;padding:40px;color:var(--text-muted)">
            <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;margin-bottom:10px"></i>
            <p>جاري تحميل الطلبات...</p>
          </div>
        </div>
      </div>

      <!-- 2. قسم إدارة المنتجات -->
      <div id="productsTab" class="tab-content">
        <div class="form-card">
          <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:20px"><i class="fa-solid fa-plus"></i> إضافة منتج جديد</h2>
          <form id="productForm" novalidate>
            <div class="form-grid">
              <div class="form-group"><label>اسم المنتج</label><input type="text" id="productName" required></div>
              <div class="form-group"><label>السعر (دج)</label><input type="number" id="productPrice" min="0" step="100" required></div>
            </div>
            <div class="form-grid">
              <div class="form-group"><label>السعر القديم (دج - اختياري)</label><input type="number" id="productOldPrice" min="0" step="100"></div>
              <div class="form-group"><label>نص الشارة (اختياري)</label><input type="text" id="productBadge" placeholder="مثال: خصم 20%"></div>
            </div>
            
            <!-- إضافة رابط الفيديو -->
            <div class="form-grid full">
              <div class="form-group">
                <label>رابط فيديو للمنتج (اختياري)</label>
                <input type="url" id="productVideoUrl" placeholder="رابط فيديو MP4 مباشر أو أي رابط مدعوم...">
              </div>
            </div>

            <div class="form-grid full">
              <div class="form-group"><label>الوصف</label><textarea id="productDescription" required></textarea></div>
            </div>

            <div class="form-grid full">
              <div class="form-group">
                <label>روابط الصور والألوان والستايلات</label>
                <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:10px">الصق رابط الصورة المباشر واسم الستايل أو اللون الخاص بها. يمكنك إضافة عدة روابط.</p>
                <div id="imageColorContainer" style="display:flex;flex-direction:column;gap:10px;margin-bottom:12px">
                  
                  <!-- الحقل الأول الافتراضي -->
                  <div class="image-color-row" style="display:flex;gap:10px;align-items:center;background:rgba(255,255,255,0.02);padding:10px;border-radius:10px;border:1px solid var(--border)">
                    <input type="url" class="productImageUrlInput" placeholder="رابط الصورة (https://...)" style="flex:2;padding:10px" required>
                    <input type="text" class="productColorInput" placeholder="اللون/الستايل (مثال: أحمر)" style="flex:1;padding:10px" required>
                    <button type="button" class="btn btn-danger remove-row-btn" style="padding:10px;min-height:auto"><i class="fa-solid fa-trash"></i></button>
                  </div>

                </div>
                <button type="button" id="addImageRowBtn" class="btn btn-secondary" style="min-height:40px"><i class="fa-solid fa-plus"></i> إضافة رابط صورة آخر</button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:16px"><i class="fa-solid fa-plus"></i> نشر المنتج</button>
          </form>
        </div>

        <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:18px">المنتجات الحالية</h2>
        <div class="products-grid" id="productsGrid"></div>
      </div>

    </div>
  </main>

  <!-- نافذة تعديل المنتج Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">تعديل المنتج</h3>
        <button class="close-modal" onclick="closeEditModal()" type="button"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="editForm" novalidate>
        <input type="hidden" id="editProductId">
        <div class="form-grid">
          <div class="form-group"><label>الاسم</label><input type="text" id="editProductName" required></div>
          <div class="form-group"><label>السعر</label><input type="number" id="editProductPrice" min="0" required></div>
        </div>
        <div class="form-grid">
          <div class="form-group"><label>السعر القديم</label><input type="number" id="editProductOldPrice" min="0"></div>
          <div class="form-group"><label>الشارة</label><input type="text" id="editProductBadge"></div>
        </div>
        
        <!-- حقل الفيديو في التعديل -->
        <div class="form-grid full">
          <div class="form-group">
            <label>رابط فيديو للمنتج (اختياري)</label>
            <input type="url" id="editProductVideoUrl" placeholder="رابط فيديو MP4 مباشر...">
          </div>
        </div>

        <div class="form-grid full">
          <div class="form-group"><label>الوصف</label><textarea id="editProductDescription" required></textarea></div>
        </div>

        <div class="form-grid full">
          <div class="form-group">
            <label>الصور والألوان الحالية (روابط)</label>
            <div id="editImageColorContainer" style="display:flex;flex-direction:column;gap:10px;margin-bottom:12px"></div>
            
            <label style="margin-top:10px">إضافة روابط جديدة للمنتج</label>
            <div id="newEditImageColorContainer" style="display:flex;flex-direction:column;gap:10px;margin-top:10px"></div>
            <button type="button" id="addEditImageRowBtn" class="btn btn-secondary" style="margin-top:10px;min-height:40px"><i class="fa-solid fa-plus"></i> إضافة رابط صورة جديدة</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:16px"><i class="fa-solid fa-check"></i> حفظ التعديلات</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // معلومات الفايربيس الخاصة بك
    const firebaseConfig = {
      apiKey: "AIzaSyAgtlnihkwBmrnV778b35B3ydLzjMi3w",
      authDomain: "orialuxe.firebaseapp.com",
      projectId: "orialuxe",
      storageBucket: "orialuxe.firebasestorage.app",
      messagingSenderId: "456235139808",
      appId: "1:456235139808:web:3615adab2400bad8910685"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const messageBox = document.getElementById('messageBox');
    const productsGrid = document.getElementById('productsGrid');
    const ordersGrid = document.getElementById('ordersGrid');
    const productForm = document.getElementById('productForm');
    const editForm = document.getElementById('editForm');
    const editModal = document.getElementById('editModal');

    // وظيفة التنقل بين التبويبات
    window.switchTab = function(tabName) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(tabName + 'Tab').classList.add('active');
      event.currentTarget.classList.add('active');

      if(tabName === 'orders') loadOrders();
      if(tabName === 'products') loadProducts();
    };

    function showMessage(message, type) {
      messageBox.innerHTML = `
        <div class="message-box ${type}">
          <i class="fa-solid fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
          <span>${message}</span>
        </div>
      `;
      setTimeout(() => messageBox.innerHTML = '', 4000);
    }

    function formatPrice(val) { return Number(val || 0).toLocaleString("ar-DZ") + " دج"; }
    function formatDate(isoString) { 
      if(!isoString) return "غير معروف";
      const d = new Date(isoString);
      return d.toLocaleDateString("ar-DZ") + " " + d.toLocaleTimeString("ar-DZ", {hour:'2-digit', minute:'2-digit'});
    }

    // ==========================================
    // 1. نظام الطلبات (Orders System)
    // ==========================================
    const statusMap = {
      'pending': { label: 'قيد الانتظار ⏳', class: 'status-pending' },
      'shipped': { label: 'تم الشحن 🚚', class: 'status-shipped' },
      'completed': { label: 'مكتمل ✅', class: 'status-completed' },
      'cancelled': { label: 'ملغى ❌', class: 'status-cancelled' }
    };

    async function loadOrders() {
      try {
        ordersGrid.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-muted)"><i class="fa-solid fa-spinner fa-spin" style="font-size:2rem"></i></div>`;
        const querySnapshot = await getDocs(query(collection(db, "orders"), orderBy("createdAt", "desc")));
        
        if (querySnapshot.empty) {
          ordersGrid.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-muted)">لا توجد طلبات حتى الآن.</div>`;
          return;
        }

        let html = '';
        querySnapshot.forEach((docSnap) => {
          const order = docSnap.data();
          const id = docSnap.id;
          const status = statusMap[order.status] || statusMap['pending'];
          
          let itemsHTML = '';
          if(order.items && order.items.length) {
            order.items.forEach(item => {
              itemsHTML += `
                <div class="order-item-row">
                  <div style="display:flex;align-items:center">
                    ${item.image ? `<img src="${item.image}" alt="">` : ''}
                    <div>
                      <strong>${item.name}</strong><br>
                      <small style="color:var(--text-muted)">الستايل/اللون: ${item.color || '-'} | الكمية: ${item.quantity}</small>
                    </div>
                  </div>
                  <strong>${formatPrice(item.total)}</strong>
                </div>
              `;
            });
          }

          html += `
            <div class="order-card">
              <div class="order-header">
                <div class="order-info">
                  <h3>طلب #${id.substring(0,8).toUpperCase()}</h3>
                  <p><i class="fa-solid fa-clock"></i> ${formatDate(order.createdAtISO)}</p>
                </div>
                <span class="order-status ${status.class}">${status.label}</span>
              </div>
              <div class="order-details">
                <div>
                  <h4 style="margin-bottom:10px;color:var(--gold)"><i class="fa-solid fa-user"></i> العميل</h4>
                  <p><strong>الاسم:</strong> ${order.customer?.fullName || '-'}</p>
                  <p><strong>الهاتف:</strong> <a href="tel:${order.customer?.phone}" style="color:var(--gold)">${order.customer?.phone || '-'}</a></p>
                  <p><strong>الولاية:</strong> ${order.customer?.state || '-'}</p>
                  <p><strong>العنوان:</strong> ${order.customer?.address || '-'}</p>
                  <p><strong>التوصيل:</strong> ${order.delivery?.label || '-'} (${formatPrice(order.delivery?.shippingCost)})</p>
                </div>
                <div>
                  <h4 style="margin-bottom:10px;color:var(--gold)"><i class="fa-solid fa-cart-shopping"></i> المنتجات</h4>
                  <div class="order-items-list">${itemsHTML}</div>
                  <div class="order-totals" style="margin-top:10px">
                    <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span>المجموع الفرعي:</span> <span>${formatPrice(order.pricing?.subtotal)}</span></div>
                    <div style="display:flex;justify-content:space-between;margin-bottom:5px;color:var(--success)"><span>الخصم:</span> <span>- ${formatPrice(order.pricing?.discount)}</span></div>
                    <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span>الشحن:</span> <span>${formatPrice(order.delivery?.shippingCost)}</span></div>
                    <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:5px;font-weight:bold;color:var(--gold);font-size:1.1rem"><span>الإجمالي:</span> <span>${formatPrice(order.pricing?.total)}</span></div>
                  </div>
                </div>
              </div>
              <div class="order-actions">
                <button onclick="updateOrderStatus('${id}', 'pending')" class="status-btn" style="background:rgba(212,165,116,0.1);color:#d4a574">قيد الانتظار</button>
                <button onclick="updateOrderStatus('${id}', 'shipped')" class="status-btn" style="background:rgba(54,145,179,0.1);color:#3691b3">شحن الطلب</button>
                <button onclick="updateOrderStatus('${id}', 'completed')" class="status-btn" style="background:rgba(54,179,109,0.1);color:#36b36d">مكتمل</button>
                <button onclick="updateOrderStatus('${id}', 'cancelled')" class="status-btn" style="background:rgba(204,111,111,0.1);color:#cc6f6f">إلغاء الطلب</button>
                <button onclick="deleteOrder('${id}')" class="status-btn" style="background:transparent;border-color:var(--danger);color:var(--danger);margin-right:auto"><i class="fa-solid fa-trash"></i> حذف</button>
              </div>
            </div>
          `;
        });
        ordersGrid.innerHTML = html;
      } catch(e) {
        console.error(e);
        ordersGrid.innerHTML = `<div style="text-align:center;color:var(--danger)">حدث خطأ أثناء جلب الطلبات.</div>`;
      }
    }

    window.updateOrderStatus = async function(orderId, newStatus) {
      if(!confirm("تغيير حالة الطلب؟")) return;
      try {
        await updateDoc(doc(db, "orders", orderId), { status: newStatus });
        showMessage("تم التحديث", "success"); loadOrders();
      } catch(e) { showMessage("فشل التحديث", "error"); }
    };

    window.deleteOrder = async function(orderId) {
      if(!confirm("حذف الطلب نهائياً؟ لا يمكن التراجع!")) return;
      try {
        await deleteDoc(doc(db, "orders", orderId));
        showMessage("تم الحذف", "success"); loadOrders();
      } catch(e) { showMessage("فشل الحذف", "error"); }
    };


    // ==========================================
    // 2. نظام المنتجات (إضافة/تعديل/حذف)
    // ==========================================
    let allProducts = [];

    async function loadProducts() {
      try {
        productsGrid.innerHTML = `<div style="text-align:center;padding:40px"><i class="fa-solid fa-spinner fa-spin" style="font-size:2rem"></i></div>`;
        const querySnapshot = await getDocs(collection(db, "products"));
        allProducts = [];
        querySnapshot.forEach(doc => allProducts.push({ id: doc.id, ...doc.data() }));

        if (!allProducts.length) {
          productsGrid.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-muted)">لا توجد منتجات.</div>`;
          return;
        }

        productsGrid.innerHTML = allProducts.map(product => {
          let imgUrl = "https://via.placeholder.com/200";
          if (product.variants && product.variants.length > 0) imgUrl = product.variants[0].image;
          else if (product.image) imgUrl = product.image;
          else if (product.images && product.images.length > 0) imgUrl = product.images[0];

          // إضافة علامة صغيرة إذا كان هناك فيديو
          const videoIcon = product.videoUrl ? `<span style="position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.6);padding:4px 8px;border-radius:8px;font-size:0.8rem"><i class="fa-solid fa-video" style="color:var(--gold)"></i></span>` : '';

          return `
          <article class="product-item" style="position:relative">
            <img src="${imgUrl}" class="product-image">
            ${videoIcon}
            <div class="product-info">
              <div class="product-title">${product.name}</div>
              <div class="product-price">${formatPrice(product.price)}</div>
              <div class="product-actions">
                <button class="edit-btn" onclick="editProduct('${product.id}')"><i class="fa-solid fa-pencil"></i> تعديل</button>
                <button class="delete-btn" onclick="deleteProduct('${product.id}','${product.name.replace(/'/g,"")}')"><i class="fa-solid fa-trash"></i> حذف</button>
              </div>
            </div>
          </article>
        `}).join('');
      } catch (error) {
        console.error(error);
        showMessage("خطأ في جلب المنتجات", "error");
      }
    }

    // إضافة صف لروابط الصور (Add Form)
    const addImageRowBtn = document.getElementById('addImageRowBtn');
    if (addImageRowBtn) {
      addImageRowBtn.addEventListener('click', () => {
        const container = document.getElementById('imageColorContainer');
        const row = document.createElement('div');
        row.className = 'image-color-row';
        row.style.cssText = 'display:flex;gap:10px;align-items:center;background:rgba(255,255,255,0.02);padding:10px;border-radius:10px;border:1px solid var(--border)';
        row.innerHTML = `
          <input type="url" class="productImageUrlInput" placeholder="رابط الصورة (https://...)" style="flex:2;padding:10px" required>
          <input type="text" class="productColorInput" placeholder="اللون/الستايل (مثال: أزرق)" style="flex:1;padding:10px" required>
          <button type="button" class="btn btn-danger remove-row-btn" style="padding:10px;min-height:auto"><i class="fa-solid fa-trash"></i></button>
        `;
        container.appendChild(row);
        row.querySelector('.remove-row-btn').addEventListener('click', () => row.remove());
      });
    }

    // زر حذف الصفوف الافتراضي
    document.addEventListener('click', function(e) {
      if (e.target.closest('.remove-row-btn')) { e.target.closest('.image-color-row').remove(); }
    });

    // إرسال فورم الإضافة
    productForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = productForm.querySelector('button[type="submit"]');
      const originalHTML = submitBtn.innerHTML;
      submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري النشر...';

      try {
        const rows = document.querySelectorAll('#imageColorContainer .image-color-row');
        let variants = [];
        let colors = [];

        // قراءة الروابط والألوان المدخلة
        for (let row of rows) {
          const urlInput = row.querySelector('.productImageUrlInput');
          const colorInput = row.querySelector('.productColorInput');
          if (urlInput.value.trim() !== "" && colorInput.value.trim() !== "") {
            variants.push({ color: colorInput.value.trim(), image: urlInput.value.trim() });
            colors.push(colorInput.value.trim());
          }
        }

        if (variants.length === 0) {
          showMessage("يجب إضافة رابط صورة ولون/ستايل واحد على الأقل", "error");
          submitBtn.disabled = false; submitBtn.innerHTML = originalHTML; return;
        }

        const productData = {
          name: document.getElementById('productName').value.trim(),
          price: parseInt(document.getElementById('productPrice').value),
          oldPrice: parseInt(document.getElementById('productOldPrice').value) || null,
          description: document.getElementById('productDescription').value.trim(),
          videoUrl: document.getElementById('productVideoUrl').value.trim() || null,
          variants: variants,
          colors: colors,
          badge: document.getElementById('productBadge').value.trim(),
          createdAt: new Date().toISOString()
        };

        await addDoc(collection(db, "products"), productData);
        showMessage("تم إضافة المنتج بنجاح!", "success");
        
        productForm.reset();
        document.getElementById('imageColorContainer').innerHTML = `
          <div class="image-color-row" style="display:flex;gap:10px;align-items:center;background:rgba(255,255,255,0.02);padding:10px;border-radius:10px;border:1px solid var(--border)">
            <input type="url" class="productImageUrlInput" placeholder="رابط الصورة (https://...)" style="flex:2;padding:10px" required>
            <input type="text" class="productColorInput" placeholder="اللون/الستايل (مثال: أحمر)" style="flex:1;padding:10px" required>
            <button type="button" class="btn btn-danger remove-row-btn" style="padding:10px;min-height:auto"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        loadProducts();
      } catch (error) {
        console.error(error);
        showMessage(error.message, "error");
      } finally {
        submitBtn.disabled = false; submitBtn.innerHTML = originalHTML;
      }
    });

    // حذف المنتج
    window.deleteProduct = async function(productId, productName) {
      if (!confirm(`هل تريد حقاً حذف "${productName}"؟`)) return;
      try {
        await deleteDoc(doc(db, "products", productId));
        showMessage("تم حذف المنتج بنجاح!", "success");
        loadProducts();
      } catch (error) { showMessage(error.message, "error"); }
    };

    // ==========================================
    // نافذة التعديل (Edit Product Modal)
    // ==========================================
    
    // إضافة صف جديد للروابط في نافذة التعديل
    document.getElementById('addEditImageRowBtn').addEventListener('click', () => {
      const container = document.getElementById('newEditImageColorContainer');
      const row = document.createElement('div');
      row.className = 'new-edit-image-color-row';
      row.style.cssText = 'display:flex;gap:10px;align-items:center;background:rgba(255,255,255,0.02);padding:10px;border-radius:10px;border:1px dashed var(--gold)';
      row.innerHTML = `
        <input type="url" class="newEditProductImageUrlInput" placeholder="رابط الصورة (https://...)" style="flex:2;padding:10px" required>
        <input type="text" class="newEditProductColorInput" placeholder="اللون/الستايل" style="flex:1;padding:10px" required>
        <button type="button" class="btn btn-danger remove-new-edit-row-btn" style="padding:10px;min-height:auto"><i class="fa-solid fa-trash"></i></button>
      `;
      container.appendChild(row);
      row.querySelector('.remove-new-edit-row-btn').addEventListener('click', () => row.remove());
    });

    window.editProduct = function(productId) {
      const product = allProducts.find(p => p.id === productId);
      if(!product) return;

      document.getElementById('editProductId').value = productId;
      document.getElementById('editProductName').value = product.name || "";
      document.getElementById('editProductPrice').value = product.price || "";
      document.getElementById('editProductOldPrice').value = product.oldPrice || "";
      document.getElementById('editProductBadge').value = product.badge || "";
      document.getElementById('editProductDescription').value = product.description || "";
      document.getElementById('editProductVideoUrl').value = product.videoUrl || "";

      // تفريغ الحاويات
      const editImageContainer = document.getElementById('editImageColorContainer');
      editImageContainer.innerHTML = "";
      document.getElementById('newEditImageColorContainer').innerHTML = "";

      // المتغيرات الحالية (Variants)
      window.currentVariants = [];
      
      // التوافق مع البيانات القديمة والجديدة
      if(product.variants && product.variants.length > 0) {
        window.currentVariants = [...product.variants];
      } else if(product.image || (product.images && product.images.length > 0)) {
        let imgs = product.images || [product.image];
        let cols = product.colors || [];
        imgs.forEach((img, idx) => {
          window.currentVariants.push({ image: img, color: cols[idx] || "" });
        });
      }

      // رسم الحقول الموجودة
      window.currentVariants.forEach((variant, index) => {
        const row = document.createElement('div');
        row.className = 'existing-variant-row';
        row.style.cssText = 'display:flex;gap:10px;align-items:center;background:rgba(255,255,255,0.02);padding:10px;border-radius:10px;border:1px solid var(--border)';
        row.innerHTML = `
          <img src="${variant.image}" style="width:50px;height:50px;object-fit:cover;border-radius:5px" onerror="this.src='https://via.placeholder.com/50'">
          <input type="url" class="existingImageUrlInput" data-index="${index}" value="${variant.image}" placeholder="رابط الصورة" style="flex:2;padding:10px">
          <input type="text" class="existingColorInput" data-index="${index}" value="${variant.color}" placeholder="اللون/الستايل" style="flex:1;padding:10px">
          <button type="button" class="btn btn-danger remove-existing-row-btn" data-index="${index}" style="padding:10px;min-height:auto"><i class="fa-solid fa-trash"></i></button>
        `;
        editImageContainer.appendChild(row);

        // مستمعات الأحداث للتحديث المباشر
        row.querySelector('.remove-existing-row-btn').addEventListener('click', (e) => {
          const idx = parseInt(e.currentTarget.getAttribute('data-index'));
          window.currentVariants[idx] = null; // نضع قيمة فارغة بدلاً من الحذف لتجنب خربطة الفهرس (Index)
          e.currentTarget.closest('.existing-variant-row').remove();
        });

        row.querySelector('.existingImageUrlInput').addEventListener('change', (e) => {
          const idx = parseInt(e.currentTarget.getAttribute('data-index'));
          if(window.currentVariants[idx]) window.currentVariants[idx].image = e.target.value.trim();
        });

        row.querySelector('.existingColorInput').addEventListener('change', (e) => {
          const idx = parseInt(e.currentTarget.getAttribute('data-index'));
          if(window.currentVariants[idx]) window.currentVariants[idx].color = e.target.value.trim();
        });
      });

      editModal.classList.add('open');
    };

    window.closeEditModal = () => editModal.classList.remove('open');

    // حفظ التعديلات
    editForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = editForm.querySelector('button[type="submit"]');
      const originalHTML = submitBtn.innerHTML;
      submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';

      try {
        const productId = document.getElementById('editProductId').value;
        const productRef = doc(db, "products", productId);

        // فلترة الروابط المحذوفة (التي أصبحت null)
        let variantsToSave = window.currentVariants.filter(v => v !== null);

        // جلب الروابط الجديدة المضافة
        const newRows = document.querySelectorAll('#newEditImageColorContainer .new-edit-image-color-row');
        for (let row of newRows) {
          const urlInput = row.querySelector('.newEditProductImageUrlInput');
          const colorInput = row.querySelector('.newEditProductColorInput');
          if (urlInput.value.trim() !== "" && colorInput.value.trim() !== "") {
            variantsToSave.push({ color: colorInput.value.trim(), image: urlInput.value.trim() });
          }
        }

        if (variantsToSave.length === 0) {
          showMessage("المنتج يجب أن يحتوي على صورة واحدة على الأقل", "error");
          submitBtn.disabled = false; submitBtn.innerHTML = originalHTML; return;
        }

        let colors = variantsToSave.map(v => v.color);

        let updateData = {
          name: document.getElementById('editProductName').value.trim(),
          price: parseInt(document.getElementById('editProductPrice').value),
          oldPrice: parseInt(document.getElementById('editProductOldPrice').value) || null,
          description: document.getElementById('editProductDescription').value.trim(),
          videoUrl: document.getElementById('editProductVideoUrl').value.trim() || null,
          badge: document.getElementById('editProductBadge').value.trim(),
          variants: variantsToSave,
          colors: colors
        };

        await updateDoc(productRef, updateData);
        showMessage("تم تحديث المنتج بنجاح!", "success");
        closeEditModal();
        loadProducts();
      } catch (error) {
        console.error(error);
        showMessage("فشل في تحديث المنتج", "error");
      } finally {
        submitBtn.disabled = false; submitBtn.innerHTML = originalHTML;
      }
    });

    // التشغيل المبدئي
    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadOrders(); loadProducts();
    });
    
    // تحميل الطلبات عند فتح الصفحة كافتراضي
    loadOrders();
  </script>
</body>
    </html>
